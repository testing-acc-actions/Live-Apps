
name: Deploy Website Compare Lambda

on:
  push:
    branches:
      - lambda-url-validation
    paths:
      - "backend/**"
      - ".github/workflows/deploy-lambda.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-compare-lambda-deployment
  cancel-in-progress: false

jobs:

  test:
    name: Run Lambda Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate Python syntax
        run: python -m compileall -q backend

      - name: Run unit tests
        run: python -m unittest discover -s backend -p "test_*.py" -v

  deploy:
    name: Deploy to AWS Lambda
    needs: test

    if: github.ref == 'refs/heads/lambda-url-validation'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::089307775293:role/GitHubActions-Lambda-Deploy
          aws-region: us-east-1
          role-session-name: GitHubActions-Lambda-Deploy
          allowed-account-ids: "089307775293"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Package Lambda code
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("backend/lambda_function.py")
          package = Path("lambda-deployment.zip")

          if not source.is_file():
              raise SystemExit("Lambda source file not found.")

          with ZipFile(package, "w", ZIP_DEFLATED) as archive:
              archive.write(source, arcname="lambda_function.py")

          with ZipFile(package, "r") as archive:
              print("Package contents:")
              for name in archive.namelist():
                  print(name)
          PY

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name website-compare \
            --zip-file fileb://lambda-deployment.zip \
            --region us-east-1

      - name: Set Lambda execution timeout
        run: |
          aws lambda update-function-configuration \
            --function-name website-compare \
            --timeout 90 \
            --region us-east-1

      - name: Wait for Lambda configuration update
        run: |
          aws lambda wait function-updated \
            --function-name website-compare \
            --region us-east-1

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name website-compare \
            --region us-east-1

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration \
            --function-name website-compare \
            --region us-east-1 \
            --query '{Function:FunctionName,Runtime:Runtime,Handler:Handler,Status:LastUpdateStatus,Modified:LastModified}' \
            --output table
